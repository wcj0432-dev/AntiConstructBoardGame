name: Build and publish downloadable game
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要打包并发布的已有版本标签"
        required: true
        default: "v0.6.0"
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify game rules
        run: npm test
      - name: Package Windows and offline editions
        run: npm run release:pack
      - name: Run the packaged Windows executable
        run: npm run test:desktop -- artifacts/desktop/FederationOfWorlds-win32-x64/FederationOfWorlds.exe
      - name: Verify offline HTML through real browser interactions
        shell: pwsh
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $offlineUrl = node -e "console.log(require('node:url').pathToFileURL(require('node:path').resolve('offline/index.html')).href)"
          function Invoke-BrowserSmoke([string] $smokeScript) {
            & npm run $smokeScript -- $offlineUrl 2>&1 | Tee-Object -Variable smokeLog
            $smokeStatus = $LASTEXITCODE
            if ($smokeStatus -ne 0) {
              # Preserve the real failure in the API-visible check annotation,
              # including when the separate Actions log service is unavailable.
              $details = ($smokeLog | Select-Object -Last 80) -join "`n"
              $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=$smokeScript failed::$details"
              exit $smokeStatus
            }
          }
          Invoke-BrowserSmoke 'test:browser'
          Invoke-BrowserSmoke 'test:v3'
          Invoke-BrowserSmoke 'test:v4'
          Invoke-BrowserSmoke 'test:v5'
          Invoke-BrowserSmoke 'test:v6'
      - name: Store build downloads
        uses: actions/upload-artifact@v4
        with:
          name: Federation-of-Worlds-downloads
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Verify release tag matches application version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/*.zip | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPO --verify-tag --title "诸界联邦 $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md @assets artifacts/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
